<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Reel</title>
<meta name="description" content="Free, ad-free classic movies from the public domain, streamed from the Internet Archive.">
<style>
  :root {
    --bg: #0f1115;
    --surface: #181b22;
    --surface-2: #222632;
    --text: #e8eaf0;
    --muted: #9aa1b2;
    --accent: #f5c518;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(15, 17, 21, 0.95);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--surface-2);
    padding: 12px 16px;
  }
  .bar { max-width: 1200px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .logo { font-weight: 800; font-size: 1.3rem; letter-spacing: 0.5px; margin-right: auto; }
  .logo span { color: var(--accent); }
  form { display: flex; gap: 8px; flex: 1 1 280px; max-width: 480px; }
  input[type=search] {
    flex: 1; min-width: 0; padding: 9px 12px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--surface-2); border-radius: var(--radius); font-size: 1rem;
  }
  button {
    cursor: pointer; border: 0; border-radius: var(--radius);
    padding: 9px 14px; font-size: 0.95rem; font-weight: 600;
    background: var(--accent); color: #111;
  }
  .chips { max-width: 1200px; margin: 10px auto 0; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .chip {
    background: var(--surface); color: var(--muted); white-space: nowrap;
    border: 1px solid var(--surface-2); font-weight: 500;
  }
  .chip[aria-pressed=true] { background: var(--accent); color: #111; border-color: var(--accent); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
  .status { color: var(--muted); margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
  .card {
    background: var(--surface); border-radius: var(--radius); overflow: hidden;
    cursor: pointer; transition: transform 0.15s; text-align: left; padding: 0; color: inherit; font-weight: normal;
  }
  .card:hover, .card:focus-visible { transform: translateY(-3px); outline: 2px solid var(--accent); }
  .card img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; display: block; background: var(--surface-2); }
  .card .meta { padding: 8px 10px 10px; }
  .card .title { font-size: 0.92rem; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .year { color: var(--muted); font-size: 0.82rem; }
  .more { display: block; margin: 28px auto 0; }
  dialog {
    width: min(960px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
    padding: 0; border: 0; border-radius: var(--radius);
    background: var(--surface); color: var(--text);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.8); }
  .player { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .details { padding: 16px 20px 20px; }
  .details h2 { margin: 0 0 4px; font-size: 1.25rem; }
  .details p { color: var(--muted); margin: 8px 0 0; max-height: 9em; overflow: auto; }
  .details a { color: var(--accent); }
  .close { position: absolute; top: 8px; right: 8px; z-index: 2; background: rgba(0,0,0,0.7); color: #fff; }
  footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 24px 16px 40px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">Open<span>Reel</span></div>
    <form id="search-form" role="search">
      <input id="q" type="search" placeholder="Search classic movies…" aria-label="Search movies">
      <button type="submit">Search</button>
    </form>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <p class="status" id="status">Loading…</p>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>Load more</button>
</main>

<dialog id="modal">
  <button class="close" id="close" aria-label="Close">✕</button>
  <div class="player"><iframe id="frame" allowfullscreen allow="fullscreen"></iframe></div>
  <div class="details">
    <h2 id="m-title"></h2>
    <div class="year" id="m-year"></div>
    <p id="m-desc"></p>
    <p><a id="m-link" target="_blank" rel="noopener">View on the Internet Archive</a></p>
  </div>
</dialog>

<footer>
  Every film here is in the public domain or freely licensed, streamed from the
  <a href="https://archive.org/details/feature_films" target="_blank" rel="noopener">Internet Archive</a>.
  No ads, no tracking, no accounts.
</footer>

<script>
  const API = "https://archive.org/advancedsearch.php";
  const PAGE_SIZE = 36;

  // Each category is a filter on the Internet Archive's public-domain film collections.
  const CATEGORIES = [
    { label: "Popular",  query: "collection:feature_films" },
    { label: "Comedy",   query: "collection:feature_films AND subject:comedy" },
    { label: "Horror",   query: "collection:feature_films AND subject:horror" },
    { label: "Sci-Fi",   query: "collection:feature_films AND subject:(\"science fiction\" OR sci-fi)" },
    { label: "Noir",     query: "collection:feature_films AND subject:noir" },
    { label: "Western",  query: "collection:feature_films AND subject:western" },
    { label: "Drama",    query: "collection:feature_films AND subject:drama" },
    { label: "Silent",   query: "collection:feature_films AND subject:silent" },
    { label: "Cartoons", query: "collection:classic_cartoons" },
  ];

  const state = { query: CATEGORIES[0].query, page: 1, loaded: 0, total: 0 };
  const $ = (id) => document.getElementById(id);

  function renderChips(active) {
    $("chips").replaceChildren(...CATEGORIES.map((c) => {
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = c.label;
      b.setAttribute("aria-pressed", String(c.label === active));
      b.onclick = () => { $("q").value = ""; renderChips(c.label); start(c.query); };
      return b;
    }));
  }

  function buildUrl(query, page) {
    const p = new URLSearchParams({ q: `(${query}) AND mediatype:movies`, rows: PAGE_SIZE, page, output: "json" });
    ["identifier", "title", "year", "description"].forEach((f) => p.append("fl[]", f));
    p.append("sort[]", "downloads desc");
    return `${API}?${p}`;
  }

  function cleanText(html) {
    // DOMParser builds an inert document, so markup in descriptions can't run scripts.
    const src = Array.isArray(html) ? html.join(" ") : (html || "");
    return new DOMParser().parseFromString(src, "text/html").body.textContent.trim();
  }

  function card(doc) {
    const b = document.createElement("button");
    b.className = "card";
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.onerror = () => { img.style.visibility = "hidden"; };
    img.src = `https://archive.org/services/img/${encodeURIComponent(doc.identifier)}`;
    const meta = document.createElement("div");
    meta.className = "meta";
    const t = document.createElement("div");
    t.className = "title";
    t.textContent = doc.title || doc.identifier;
    const y = document.createElement("div");
    y.className = "year";
    y.textContent = doc.year || "";
    meta.append(t, y);
    b.append(img, meta);
    b.onclick = () => openMovie(doc);
    return b;
  }

  async function load() {
    $("more").hidden = true;
    $("status").textContent = state.loaded ? "Loading more…" : "Loading…";
    try {
      const res = await fetch(buildUrl(state.query, state.page));
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const { response } = await res.json();
      state.total = response.numFound;
      state.loaded += response.docs.length;
      $("grid").append(...response.docs.map(card));
      $("status").textContent = state.total
        ? `${state.total.toLocaleString()} free movies`
        : "No movies found. Try another search.";
      $("more").hidden = state.loaded >= state.total;
    } catch (err) {
      $("status").textContent = "Couldn't reach the Internet Archive. Check your connection and try again.";
      console.error(err);
    }
  }

  function start(query) {
    Object.assign(state, { query, page: 1, loaded: 0, total: 0 });
    $("grid").replaceChildren();
    load();
  }

  function openMovie(doc) {
    const id = encodeURIComponent(doc.identifier);
    $("frame").src = `https://archive.org/embed/${id}`;
    $("m-title").textContent = doc.title || doc.identifier;
    $("m-year").textContent = doc.year || "";
    $("m-desc").textContent = cleanText(doc.description);
    $("m-link").href = `https://archive.org/details/${id}`;
    $("modal").showModal();
  }

  function closeMovie() {
    $("modal").close();
  }

  // Stop playback whenever the dialog closes (button, Esc, or backdrop click).
  $("modal").addEventListener("close", () => { $("frame").src = "about:blank"; });
  $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeMovie(); });
  $("close").onclick = closeMovie;
  $("more").onclick = () => { state.page += 1; load(); };

  $("search-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = $("q").value.trim().replace(/[()"\\]/g, " ");
    if (!q) return;
    renderChips(null);
    start(`collection:(feature_films OR classic_cartoons) AND (title:(${q}) OR subject:(${q}))`);
  });

  renderChips(CATEGORIES[0].label);
  start(state.query);
</script>
</body>
</html>
